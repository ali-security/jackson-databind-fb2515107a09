name: Build and Deploy Snapshot
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated test class selector (empty = full suite)"
        required: false
        default: ""
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 has a few failures so cannot yet enable for this module
        java_version: ['8', '11']
        os: ['ubuntu-latest']
    env:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java_version }}
        cache: 'maven'
        server-id: sonatype-nexus-snapshots
        server-username: CI_DEPLOY_USERNAME
        server-password: CI_DEPLOY_PASSWORD
        # See https://github.com/actions/setup-java/blob/v2/docs/advanced-usage.md#Publishing-using-Apache-Maven
        # gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }} # Value of the GPG private key to import
        # gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
    - name: Build
      env:
        FILTER: ${{ inputs.test-filter }}
      run: |
        if [ -n "$FILTER" ]; then
          ./mvnw -B -q -ff -ntp verify -Dtest="${FILTER// /,}" -Dsurefire.failIfNoSpecifiedTests=false
        else
          ./mvnw -B -q -ff -ntp verify
        fi
    - name: Print test results
      if: always()
      run: |
        python3 - <<'PY'
        import glob, xml.etree.ElementTree as ET
        t = f = e = sk = 0
        for p in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
            r = ET.parse(p).getroot()
            n, ff, ee, ss = (int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
            t += n; f += ff; e += ee; sk += ss
            print(f"{r.get('name')}: tests={n} failures={ff} errors={ee} skipped={ss}")
            for tc in r.iter('testcase'):
                s = tc.find('skipped')
                if s is not None:
                    print(f"SKIPPED: {tc.get('classname')}.{tc.get('name')} -- {s.get('message') or 'no message'}")
        print(f"TOTAL: Tests run: {t}, Failures: {f}, Errors: {e}, Skipped: {sk}, Passed: {t - f - e - sk}")
        PY
    - name: Upload jar
      if: matrix.java_version == '8'
      uses: actions/upload-artifact@v4
      with:
        name: jackson-databind-jar
        path: target/jackson-databind-*[0-9].jar
        if-no-files-found: error
    - name: Extract project Maven version
      id: projectVersion
      run: echo ::set-output name=version::$(./mvnw org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -DforceStdout -Dexpression=project.version -q)
    - name: Deploy snapshot
      if: false && github.event_name != 'pull_request' && matrix.java_version == '8' && endsWith(steps.projectVersion.outputs.version, '-SNAPSHOT')
      env:
        CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
        CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
        # MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: ./mvnw -B -q -ff -DskipTests -ntp source:jar deploy
    - name: Generate code coverage
      if: github.event_name != 'pull_request' && matrix.java_version == '8'
      run: ./mvnw -B -q -ff -ntp test
    - name: Publish code coverage
      if: false && github.event_name != 'pull_request' && matrix.java_version == '8'
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
